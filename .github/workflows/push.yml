name: Build on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve ref
        id: ref
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          DEFAULT_REF: ${{ github.ref }}
        run: echo "ref=${BRANCH:-$DEFAULT_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          base_version="$(.github/scripts/resolve_next_version.sh "$REF")"
          # Nightly format: <base>-<YYYYMMDD>-<HHMM00>-<shortsha>.
          start_time="$(date -u +%Y%m%d-%H%M00)"
          short_sha="$(git rev-parse --short HEAD)"
          echo "version=${base_version}-${start_time}-${short_sha}" >> "$GITHUB_OUTPUT"

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
    permissions:
      contents: read
