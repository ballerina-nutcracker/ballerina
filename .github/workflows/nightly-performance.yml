name: Nightly Performance

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      comparison_date:
        description: 'Colombo comparison date (YYYY-MM-DD); blank uses original run creation time'
        required: false
        type: string

permissions: {}

concurrency:
  group: nightly-performance
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      date: ${{ steps.select.outputs.date }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      control_sha: ${{ steps.select.outputs.control_sha }}
      skip: ${{ steps.select.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select frozen mainline comparison
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMPARISON_DATE: ${{ inputs.comparison_date }}
        run: >-
          python3 .github/scripts/nightly_perf.py select
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --manifest manifest/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-performance-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: manifest/manifest.json
          retention-days: 30
          if-no-files-found: error

  measure:
    name: measure (${{ matrix.suite }})
    needs: prepare
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [time, memory, http]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned acquisition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y time wrk
          curl -fsSL https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb -o /tmp/hyperfine.deb
          echo 'e0391897ffb490af8a6b64e0e4281ac2c8e10cbcbb875bd22a376f44cdb263ab  /tmp/hyperfine.deb' | sha256sum --check
          sudo dpkg -i /tmp/hyperfine.deb
          python3 -m pip install -r compiler-tools/benchmark-stats/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: nightly-performance-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: manifest
      - name: Build trusted acquisition tool
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = http ]; then
            go build -o /tmp/nightly-benchmark ./compiler-tools/benchmark-http
          else
            go build -o /tmp/nightly-benchmark ./compiler-tools/benchmark
          fi
      - name: Acquire independent pilot and final samples
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "measurements/$SUITE"
          python3 compiler-tools/benchmark-stats/run.py \
            --suite "$SUITE" --manifest manifest/manifest.json \
            --output "measurements/$SUITE" --tool /tmp/nightly-benchmark \
            2>&1 | tee "measurements/$SUITE/full.log"
      - name: Retain incremental measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-performance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: measurements/${{ matrix.suite }}/
          retention-days: 30
          if-no-files-found: warn

  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: nightly-performance-runtime-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Watch current attempt independently
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/nightly_perf.py monitor
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"

  report:
    needs: [prepare, measure]
    if: >-
      always() && !cancelled()
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: nightly-performance-report-${{ needs.prepare.outputs.base_sha || github.run_id }}-${{ needs.prepare.outputs.head_sha || github.run_attempt }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r compiler-tools/benchmark-stats/requirements.txt
      - name: Download this attempt's artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-performance-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: perf-artifacts
          merge-multiple: false
      - name: Validate raw evidence and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/nightly_perf.py report
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output perf-artifacts
          --manifest "perf-artifacts/nightly-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-manifest/manifest.json"
