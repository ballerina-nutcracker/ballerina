name: Nightly Flake Sniffer

on:
  schedule:
    # 03:00 UTC every day, one hour after the nightly race detector
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/scripts/cpu_load.py'
      - '.github/scripts/test_cpu_load.py'
      - '.github/scripts/collect_failures.py'
      - '.github/scripts/test_collect_failures.py'
      - '.github/scripts/run_native_tests.py'
      - '.github/scripts/test_grouped_test_output.py'
      - '.github/workflows/nightly-flake-sniffer.yml'

permissions:
  contents: read

jobs:
  script-tests:
    name: Test sniffer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test CPU load wrapper
        run: python3 .github/scripts/test_cpu_load.py
      - name: Test failure collector
        run: python3 .github/scripts/test_collect_failures.py
      - name: Test grouped module output
        run: python3 .github/scripts/test_grouped_test_output.py

  sniff:
    name: Sniff (copy ${{ matrix.copy }})
    needs: script-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        copy: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine wrk
      - name: Run CI tests under load with shuffle
        shell: bash
        env:
          GOFLAGS: -shuffle=on
        run: |
          code=0
          python3 .github/scripts/cpu_load.py --factor 2 --log test-output.log -- \
            python3 .github/scripts/run_native_tests.py --group-output || code=$?
          echo "$code" > exit-code
          exit "$code"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sniff-${{ runner.os }}-${{ matrix.copy }}
          path: |
            test-output.log
            exit-code
          if-no-files-found: warn

  report:
    name: Report failures
    needs: sniff
    if: always() && github.event_name != 'pull_request' && needs.sniff.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Download test output
        uses: actions/download-artifact@v8
        with:
          pattern: sniff-*
          path: artifacts
      - name: Collect failures
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts
          python3 .github/scripts/collect_failures.py artifacts \
            --run-url "$RUN_URL" --sha "$GITHUB_SHA" --output body.md
      - name: Comment on or open the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          label=nightly-flake-sniffer-failure
          issue=$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh api --method POST "repos/$GH_REPO/issues" \
              -f 'title=Nightly flake sniffer found failing tests' \
              -f "body=$(<body.md)" -f "labels[]=$label" --jq .html_url
          fi
