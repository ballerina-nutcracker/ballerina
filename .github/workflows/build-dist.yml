name: Build distribution

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string embedded via -X main.Version and used in artifact paths'
        required: true
        type: string
      ref:
        description: 'Git ref/SHA to build'
        required: true
        type: string

jobs:
  build:
    name: Build the Ballerina CLI for all platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLATFORMS: 'linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build the Ballerina CLI for all platforms
        env:
          VERSION: ${{ inputs.version }}
        run: |
          read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output_dir="dist/${GOOS}-${GOARCH}"
            mkdir -p "$output_dir"
            ext=""
            [[ "$GOOS" == "windows" ]] && ext=".exe"
            echo "Building for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w -X main.Version=$VERSION" \
              -o "${output_dir}/bal${ext}" \
              ./cli/cmd
          done

      - name: Build balrt for all supported platforms
        run: |
          # bal build's --target-os/--target-arch resolves its runner stub at
          # <dist>/rt/<os>-<arch>/balrt (executable.ResolveStub) — every
          # release archive bundles every supported platform's balrt, not
          # just its own, so cross-compilation works right after extracting
          # a single archive.
          read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output_dir="dist-rt/${GOOS}-${GOARCH}"
            mkdir -p "$output_dir"
            ext=""
            [[ "$GOOS" == "windows" ]] && ext=".exe"
            echo "Building balrt for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w" \
              -o "${output_dir}/balrt${ext}" \
              ./cli/internal/balrt
          done

      - name: Prepare artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts
          read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            src_dir="dist/${GOOS}-${GOARCH}"
            ext=""
            [[ "$GOOS" == "windows" ]] && ext=".exe"
            artifact_dir="artifacts/ballerina-nutcracker-${GOOS}-${GOARCH}/ballerina-${VERSION}"
            mkdir -p "$artifact_dir"
            cp "$src_dir/bal${ext}" "$artifact_dir/bal${ext}"

            for rt_platform in "${platforms[@]}"; do
              RGOOS="${rt_platform%/*}"
              RGOARCH="${rt_platform#*/}"
              rt_ext=""
              [[ "$RGOOS" == "windows" ]] && rt_ext=".exe"
              rt_dir="$artifact_dir/rt/${RGOOS}-${RGOARCH}"
              mkdir -p "$rt_dir"
              cp "dist-rt/${RGOOS}-${RGOARCH}/balrt${rt_ext}" "$rt_dir/balrt${rt_ext}"
            done
          done

      - name: Upload linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: ballerina-nutcracker-linux-amd64
          path: artifacts/ballerina-nutcracker-linux-amd64
          if-no-files-found: error

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v7
        with:
          name: ballerina-nutcracker-linux-arm64
          path: artifacts/ballerina-nutcracker-linux-arm64
          if-no-files-found: error

      - name: Upload darwin-amd64
        uses: actions/upload-artifact@v7
        with:
          name: ballerina-nutcracker-darwin-amd64
          path: artifacts/ballerina-nutcracker-darwin-amd64
          if-no-files-found: error

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: ballerina-nutcracker-darwin-arm64
          path: artifacts/ballerina-nutcracker-darwin-arm64
          if-no-files-found: error

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v7
        with:
          name: ballerina-nutcracker-windows-amd64
          path: artifacts/ballerina-nutcracker-windows-amd64
          if-no-files-found: error
