name: WASM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu-build:
    name: Ubuntu WASM Build
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
      GOEXPERIMENT: greenteagc
      GOGC: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run WASM tests (non-corpus)
        run: make test-wasm

      - name: Run WASM corpus light tests
        run: make test-wasm-corpus-light

      - name: Run WASM corpus integration tests (sharded)
        run: make test-wasm-corpus-integration
