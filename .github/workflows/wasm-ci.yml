name: WASM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ubuntu-build:
    name: Ubuntu WASM Build
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
      GOEXPERIMENT: greenteagc
      GOGC: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node 24 can deadlock in process.exit: background V8 compile threads wait
      # for a main-thread GC while the main thread joins them, so a wasm test
      # binary that already printed PASS never exits. Node 26 does not.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Run WASM tests (non-corpus)
        run: make test-wasm

      - name: Run WASM corpus light tests
        run: make test-wasm-corpus-light

      - name: Run WASM corpus integration tests (sharded)
        run: make test-wasm-corpus-integration
