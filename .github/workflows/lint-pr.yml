name: Lint PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

# IMPORTANT: pull_request_target runs with base branch context and has access to secrets.
# Permissions should be used with extreme caution.
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
permissions: {}

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Checks out the base branch (the default ref for pull_request_target), not the PR head,
      # so the validation script itself can't be altered by the PR under review.
      - uses: actions/checkout@v7
      - name: Validate current PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.title')
          python3 .github/scripts/validate_commits.py "$title"

  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Checks out the base branch (the default ref for pull_request_target), not the PR head,
      # so the validation script itself can't be altered by the PR under review.
      - uses: actions/checkout@v7
      - name: Validate non-merge commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          commits=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | select((.parents | length) <= 1) | [.sha[0:7], (.commit.message | split("\n")[0] | rtrimstr("\r") | @base64)] | @tsv')

          failed=0
          while IFS=$'\t' read -r sha encoded_subject; do
            [[ -n "$sha" ]] || continue
            subject=$(printf '%s' "$encoded_subject" | base64 --decode)
            if ! python3 .github/scripts/validate_commits.py "$subject"; then
              printf 'Commit: %s\n\n' "$sha" >&2
              failed=1
            fi
          done <<< "$commits"
          exit "$failed"
