name: WASM exit hang repro

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  repro:
    name: WASM exit hang repro (${{ matrix.variant.name }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        variant:
          - { name: go1.27.4-node24, go: "1.27.4", node: "", flags: "" }
          - { name: go1.27.1-node26, go: "1.27.1", node: "26.13.1", flags: "" }
          - { name: go1.27.4-node26, go: "1.27.4", node: "26.13.1", flags: "" }
    env:
      GOOS: js
      GOARCH: wasm
      GOEXPERIMENT: greenteagc
      GOGC: "1000"
      RUNS: "80"
      RUN_TIMEOUT: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.variant.go }}

      - name: Set up Node
        if: matrix.variant.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.variant.node }}

      - name: Install gdb
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdb >/dev/null
          gdb --version | head -1

      - name: Build wasm test binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go test -c -o "$RUNNER_TEMP/bin/scope.wasm" ./semantics/internal/analysis/scope
          go version
          node --version
          # Same as go_js_wasm_exec, plus the variant's V8 flags.
          cat > "$RUNNER_TEMP/bin/wasm_exec" <<EOF
          #!/bin/bash
          exec node --stack-size=8192 ${{ matrix.variant.flags }} "$(go env GOROOT)/lib/wasm/wasm_exec_node.js" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/wasm_exec"
          cat "$RUNNER_TEMP/bin/wasm_exec"

      - name: Run test binary repeatedly
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          hangs=0
          failures=0
          for i in $(seq 1 "$RUNS"); do
            out="$logs/scope-$i.log"
            start=$(date +%s)
            (cd semantics/internal/analysis/scope && exec "$RUNNER_TEMP/bin/wasm_exec" "$RUNNER_TEMP/bin/scope.wasm" -test.timeout 30m) >"$out" 2>&1 &
            pid=$!
            hung=0
            while kill -0 "$pid" 2>/dev/null; do
              if (( $(date +%s) - start >= RUN_TIMEOUT )); then
                hung=1
                break
              fi
              sleep 0.2
            done
            if (( hung )); then
              hangs=$((hangs + 1))
              echo "::error::scope run $i did not exit within ${RUN_TIMEOUT}s: threads=$(ps -o nlwp= -p "$pid") $(ps -o stat=,wchan:32=,cputime= -p "$pid")"
              tail -n 2 "$out"
              # Only dump native stacks for the first few hangs per shard.
              if (( hangs <= 3 )); then
                sudo gdb -p "$pid" -batch -ex 'set pagination off' -ex 'info threads' -ex 'thread apply all bt 40' 2>&1 \
                  | grep -vE '^\[New LWP|^warning:|Reading symbols|Download' | tee "$logs/scope-$i.gdb.txt"
              fi
              kill -KILL "$pid" 2>/dev/null
            fi
            wait "$pid"
            rc=$?
            took=$(( $(date +%s) - start ))
            echo "run=$i rc=$rc seconds=$took hung=$hung"
            if (( ! hung && rc != 0 )); then
              failures=$((failures + 1))
              echo "::error::scope run $i failed (rc=$rc)"
              tail -n 30 "$out"
            fi
          done
          echo "hangs=$hangs failures=$failures runs=$RUNS"
          [[ $hangs -eq 0 && $failures -eq 0 ]]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-hang-logs-${{ matrix.variant.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
