name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (vX.Y.Z); its module tags must already exist'
        required: true
        type: string

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        env:
          # github.ref is the caller's ref when this workflow is called.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            echo "tag $TAG does not exist" >&2
            exit 1
          fi
          version="${TAG#v}"
          # Any -suffix (e.g. -rc.1) means prerelease.
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Validate matching module tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: bash .github/scripts/release_dist.sh --check-tags "$TAG" "$SHA"

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
    permissions:
      contents: read

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # A calling workflow's run may hold other artifacts.
          pattern: ballerina-nutcracker-*
          path: dist

      - name: Prepare release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          for artifact_dir in dist/ballerina-nutcracker-*; do
            platform=$(basename "$artifact_dir")
            # Make the binary executable
            find "$artifact_dir" -name "bal*" -type f -exec chmod +x {} \;
            cd "$artifact_dir"
            zip -r "../../release/${platform}-${VERSION}.zip" .
            cd ../..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease }}
          make_latest: ${{ needs.version.outputs.is_prerelease == 'false' }}
