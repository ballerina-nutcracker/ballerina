name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Any -suffix (e.g. -rc.1) means prerelease.
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate matching module tags
        run: bash .github/scripts/release_dist.sh --check-tags "$GITHUB_REF_NAME" "$GITHUB_SHA"

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
    permissions:
      contents: read

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          for artifact_dir in dist/ballerina-nutcracker-*; do
            platform=$(basename "$artifact_dir")
            # Make the binary executable
            find "$artifact_dir" -name "bal*" -type f -exec chmod +x {} \;
            cd "$artifact_dir"
            zip -r "../../release/${platform}-${VERSION}.zip" .
            cd ../..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease }}
