version: "2"

linters:
  default: standard
  enable:
    - depguard
    - usetesting
    - dupl
    - exhaustive
    - iface
    - iotamixing
    - reassign
    - unparam
    - wastedassign
    - forbidigo
    - gochecknoglobals
  settings:
    usetesting:
      os-temp-dir: true
    reassign:
      patterns:
        - ".*"
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return or report an internal error instead of panicking
        - pattern: ^ast\.(Walk|Visitor)$
          msg: symbol resolution must traverse the AST explicitly instead of using ast.Walk or ast.Visitor
        - pattern: ^ast\.(Walk|WalkTypeData)$
          msg: "analysis: no visitors; descend with validate*/dispatch*"
        - pattern: ^ast\.PrettyPrinter\.Print$
          msg: "analysis: no borrowed traversal"
        - pattern: ^runtime\.Goexit$
          msg: "analysis: no hidden control flow"
        - pattern: ^semtypes\.\*?env\.Freeze$
          msg: "analysis: the type environment is read-only here"
        - pattern: ^model\.SymbolSpace\.Add\w*$
          msg: "analysis: symbols are read-only here"
        - pattern: ^model\.Scope\.AddSymbol$
          msg: "analysis: symbols are read-only here"
        - pattern: ^model\.\w+\.Set\w+$
          msg: "analysis: model values are read-only here"
        - pattern: ^semtypes\.\w+\.Set\w+$
          msg: "analysis: semtypes values are read-only here"
        - pattern: ^context\.CompilerContext\.(Diagnostics|HasErrors|HasDiagnostics|DiagnosticEnv)$
          msg: "analysis: no code may ask whether anything was reported"
      analyze-types: true
    depguard:
      rules:
        no-test-util-in-production:
          files:
            - "$all"
            - "!$test"
            - "!**/test_util/**"
          deny:
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util"
              desc: "test_util is test-only; import only from *_test.go"
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util/testphases"
              desc: "test_util/testphases is test-only; import only from *_test.go"
        analysis-scope-allowlist:
          list-mode: strict
          files:
            - "**/internal/analysis/scope/**"
            - "!$test"
          allow:
            - slices$
            - strings$
            - strconv$
            - github.com/ballerina-nutcracker/ballerina/ast$
            - github.com/ballerina-nutcracker/ballerina/model$
            - github.com/ballerina-nutcracker/ballerina/semtypes$
            - github.com/ballerina-nutcracker/ballerina/context$
            - github.com/ballerina-nutcracker/ballerina/tools/diagnostics$
            - github.com/ballerina-nutcracker/ballerina/semantics/internal/common$
            - github.com/ballerina-nutcracker/ballerina/common$
        analysis-descent-allowlist:
          list-mode: strict
          files:
            - "**/internal/analysis/**"
            - "!$test"
          allow:
            - slices$
            - strings$
            - strconv$
            - github.com/ballerina-nutcracker/ballerina/ast$
            - github.com/ballerina-nutcracker/ballerina/model$
            - github.com/ballerina-nutcracker/ballerina/semtypes$
            - github.com/ballerina-nutcracker/ballerina/context$
            - github.com/ballerina-nutcracker/ballerina/tools/diagnostics$
            - github.com/ballerina-nutcracker/ballerina/semantics/internal/common$
            - github.com/ballerina-nutcracker/ballerina/common$
            - github.com/ballerina-nutcracker/ballerina/semantics/internal/analysis/scope$
        analysis-test-allowlist:
          list-mode: strict
          files:
            - "**/internal/analysis/**/*_test.go"
          allow:
            - slices$
            - strings$
            - strconv$
            - github.com/ballerina-nutcracker/ballerina/ast$
            - github.com/ballerina-nutcracker/ballerina/model$
            - github.com/ballerina-nutcracker/ballerina/semtypes$
            - github.com/ballerina-nutcracker/ballerina/context$
            - github.com/ballerina-nutcracker/ballerina/tools/diagnostics$
            - github.com/ballerina-nutcracker/ballerina/semantics/internal/common$
            - github.com/ballerina-nutcracker/ballerina/common$
            - github.com/ballerina-nutcracker/ballerina/semantics/internal/analysis/scope$
            - testing$
            - github.com/ballerina-nutcracker/ballerina/test_util
            - flag$
            - fmt$
            - os$
            - path/filepath$
    staticcheck:
      checks:
        # Default
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  disable:
    - unused
  exclusions:
    rules:
      # The explicit-traversal rule is for symbol resolution only; tests may
      # walk the AST to inspect it.
      - linters:
          - forbidigo
        text: "symbol resolution must traverse"
        path-except: internal/symbols/
      - linters:
          - forbidigo
        text: "symbol resolution must traverse"
        path: _test\.go$
      # The semantic analysis lints apply to the non-test files
      # of internal/analysis and internal/analysis/scope only: every other
      # path of this module is listed here, so a new package is linted until
      # it is added.
      - path: (^|/)semantics\.go$|internal/(cfg|common|opaque|symbols|types)/|internal/analysis/(scope/)?[a-z_]+_test\.go$
        linters: [gochecknoglobals]
      - path: (^|/)semantics\.go$|internal/(cfg|common|opaque|symbols|types)/|internal/analysis/(scope/)?[a-z_]+_test\.go$
        linters: [forbidigo]
        text: "analysis: "
      # The zero-value facts are the two allowed globals.
      - path: internal/analysis/scope/[a-z_]+\.go$
        linters: [gochecknoglobals]
        text: "^(NoFacts|AllFacts) is a global variable"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
