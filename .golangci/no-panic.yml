version: "2"

linters:
  default: standard
  enable:
    - depguard
    - dupl
    - exhaustive
    - iface
    - iotamixing
    - reassign
    - unparam
    - wastedassign
    - forbidigo
  settings:
    reassign:
      patterns:
        - ".*"
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return or report an internal error instead of panicking
        - pattern: ^ast\.(Walk|Visitor)$
          msg: symbol resolution must traverse the AST explicitly instead of using ast.Walk or ast.Visitor
    depguard:
      rules:
        no-test-util-in-production:
          files:
            - "$all"
            - "!$test"
            - "!**/test_util/**"
          deny:
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util"
              desc: "test_util is test-only; import only from *_test.go"
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util/testphases"
              desc: "test_util/testphases is test-only; import only from *_test.go"
    staticcheck:
      checks:
        # Default
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  disable:
    - unused
  exclusions:
    rules:
      - linters:
          - forbidigo
        text: ast\.(Walk|Visitor)
        path-except: internal/symbols/
      - linters:
          - forbidigo
        text: ast\.(Walk|Visitor)
        path: _test\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
