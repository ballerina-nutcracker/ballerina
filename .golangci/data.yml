version: "2"

linters:
  default: standard
  enable:
    - depguard
    - usetesting
    - modernize
    - dupl
    - exhaustive
    - gochecksumtype
    - iface
    - iotamixing
    - reassign
    - unparam
    - wastedassign
  settings:
    usetesting:
      os-temp-dir: true
    reassign:
      patterns:
        - ".*"
    exhaustive:
      default-signifies-exhaustive: true
    gochecksumtype:
      default-signifies-exhaustive: false
    depguard:
      rules:
        no-test-util-in-production:
          files:
            - "$all"
            - "!$test"
            - "!**/test_util/**"
          deny:
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util"
              desc: "test_util is test-only; import only from *_test.go"
            - pkg: "github.com/ballerina-nutcracker/ballerina/test_util/testphases"
              desc: "test_util/testphases is test-only; import only from *_test.go"
    staticcheck:
      checks:
        # Default
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  disable:
    - unused
  exclusions:
    rules:
      # Ignore only reports consisting entirely of these private AST bases.
      # Missing concrete implementations must still fail exhaustiveness checks.
      - linters: [gochecksumtype]
        text: >-
          ^exhaustiveness check failed for sum type "BLangActionOrExpression" \(from [^)]*\): missing cases for
          bLang(AccessExpression|Action|ValueExpression|VariableReference|WorkerSendExpr|WorkerSendReceiveExpr)Base(, bLang(AccessExpression|Action|ValueExpression|VariableReference|WorkerSendExpr|WorkerSendReceiveExpr)Base)*$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
