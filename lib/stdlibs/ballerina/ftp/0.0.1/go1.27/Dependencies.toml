[ballerina]
dependencies-toml-version = "2"

[[package]]
org     = "ballerina"
name    = "time"
version = "0.0.1"

[[package]]
org     = "ballerina"
name    = "crypto"
version = "0.0.1"
dependencies = [
    {org = "ballerina", name = "time"}
]

[[package]]
org     = "ballerina"
name    = "uuid"
version = "0.0.1"
dependencies = [
    {org = "ballerina", name = "crypto"}
]

[[package]]
org     = "ballerina"
name    = "task"
version = "0.0.1"
dependencies = [
    {org = "ballerina", name = "time"},
    {org = "ballerina", name = "uuid"}
]

[[package]]
org     = "ballerina"
name    = "io"
version = "0.0.1"

[[package]]
org     = "ballerina"
name    = "log"
version = "0.0.1"

[[package]]
org     = "ballerina"
name    = "ftp"
version = "0.0.1"
dependencies = [
    {org = "ballerina", name = "crypto"},
    {org = "ballerina", name = "io"},
    {org = "ballerina", name = "log"},
    {org = "ballerina", name = "task"}
]
